<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba intercambio v5 · BingoAndino75</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px system-ui;background:#f1f5f9;color:#14263b;margin:0;padding:20px}main{max-width:720px;margin:auto}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #10243a12}button,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #b9c6d4}button{background:#0e7490;color:white;cursor:pointer}button:disabled{opacity:.5}input{max-width:100%;box-sizing:border-box} .muted{color:#5d6d80;font-size:14px}.warn{color:#9a5600}.row{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none}details{margin-top:12px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere} .tag{font-size:12px;color:#9a5600}</style></head><body><main><h2>🎰 Auditoría · Prueba intercambio v5</h2><p class="muted">Versión aislada. No modifica inscripciones, pagos ni datos de la auditoría actual.</p><section class="card" id="auth"><h3>Acceso autorizado</h3><p class="muted">Usa un correo autorizado por las políticas de acceso de Supabase. La clave pública no otorga permiso para leer datos privados.</p><div class="row"><input id="email" type="email" placeholder="Correo autorizado"><button id="send">Enviar código/enlace</button></div><div class="row" style="margin-top:10px"><input id="otp" placeholder="Código de correo (si aplica)"><button id="verify">Verificar código</button></div><p id="authStatus" class="muted"></p></section><section class="card hide" id="panel"><div class="row"><button id="load">▶ Iniciar pagos del día</button><button id="reload">↻ Actualizar</button><button id="logout">Salir</button></div><p id="status" class="muted">Sin cargar.</p><div id="review" class="muted"></div><div class="row" style="margin:12px 0"><select id="ronda" aria-label="Ronda"><option value="1">Ronda 1</option><option value="2">Ronda 2</option><option value="3">Ronda 3</option><option value="4">Ronda 4</option><option value="5">Ronda 5</option><option value="6">Ronda 6</option><option value="Final">Lleno final</option><option value="Consolación">Consolación</option><option value="Pozo">Pozo</option></select><input id="premio" inputmode="decimal" placeholder="Premio en Bs (opcional)" aria-label="Premio en bolívares"></div><div class="row"><input id="carton" inputmode="numeric" placeholder="Número de cartón"><button id="find">Buscar ganador</button></div><div id="result"></div></section></main><script>
const URL_SUPA='https://dbkixcpwirjwjvjintkr.supabase.co';
const ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRia2l4Y3B3aXJqd2p2amludGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYwNjYxNDksImV4cCI6MjA2MTY0MjE0OX0.QJmWLWSe-pRYwxWeel8df7JLhNUvMKaTpL0MCDorgho';
const db=window.supabase.createClient(URL_SUPA,ANON_KEY);
const $=id=>document.getElementById(id);
let registros=[];
const digits=x=>String(x||'').replace(/\D/g,'');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validTel(x){const d=digits(x);return /^(?:58)?0?4(?:12|14|16|24|26)\d{7}$/.test(d)}
function validCed(x){const d=digits(x);return /^\\d{6,9}$/.test(d)}
function swapped(t,c){return !validTel(t)&&!validCed(c)&&validCed(t)&&validTel(c)}
function safePayment(b,t,c){return Boolean(String(b||'').trim()&&validTel(t)&&validCed(c)&&!swapped(t,c))}
function waPhone(x){let d=digits(x);if(d.startsWith('0'))d='58'+d.slice(1);else if(d.length===10)d='58'+d;return d}
function textPayment(b,t,c){return 'Banco: '+(b||'NO REGISTRADO')+'\nTeléfono: '+(t||'NO REGISTRADO')+'\nCédula: '+(c||'NO REGISTRADA')}
function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b}
function addCopy(parent,label,data){parent.append(btn(label,()=>navigator.clipboard.writeText(data).then(()=>alert('Copiado')).catch(()=>alert('No se pudo copiar'))))}
function show(r,n){const target=$('result');target.replaceChildren();if(!r){target.textContent='Cartón no encontrado entre las compras aprobadas cargadas.';return}
const h=document.createElement('h3');h.textContent='Cartón '+n+' · '+(r.nombre||'Sin nombre');target.append(h);const rd=document.createElement('p');rd.className='muted';rd.textContent='🏆 '+$('ronda').value+($('premio').value.trim()?' · Premio: '+$('premio').value.trim()+' Bs':' · Premio sin indicar');target.append(rd);
const bank=r.pago_banco||'',t=r.pago_telefono||r.telefono||'',c=r.pago_cedula||r.cedula||'';
const warn=[];if(swapped(t,c))warn.push('POSIBLE TELÉFONO Y CÉDULA INTERCAMBIADOS. No copiar estos datos; verificar con el cliente.');if(t&&!validTel(t))warn.push('Formato de teléfono inusual: verificar antes de pagar');if(c&&(digits(c).length<6||digits(c).length>9))warn.push('Cédula con longitud inusual: verificar antes de pagar');if(!r.pago_telefono&&r.telefono)warn.push('Teléfono completado desde el registro');if(!r.pago_cedula&&r.cedula)warn.push('Cédula completada desde el registro');if(!bank)warn.push('Banco de Pago Móvil NO registrado: revisar comprobante; el banco de origen puede ser diferente');if(!safePayment(bank,t,c))warn.push('Copia de Pago Móvil principal bloqueada por datos incompletos o incompatibles.');
if(!t)warn.push('Falta teléfono');if(!c)warn.push('Falta cédula');
const p=document.createElement('pre');p.textContent=textPayment(bank,t,c);target.append(p);
warn.forEach(x=>{const e=document.createElement('p');e.className='warn';e.textContent='⚠ '+x;target.append(e)});
if(safePayment(bank,t,c))addCopy(target,'Copiar Pago Móvil principal',textPayment(bank,t,c)+($('premio').value.trim()?'\nMonto Bs: '+$('premio').value.trim():''));
if(swapped(t,c)){const swap=document.createElement('details');swap.innerHTML='<summary>🔄 Revisar teléfono y cédula intercambiados</summary>';const st=c,sc=t;const note=document.createElement('p');note.className='warn';note.textContent='⚠ Propuesta basada únicamente en los datos que registró el cliente. Verifica que corresponden al beneficiario antes de pagar. No se cambia nada en Supabase.';swap.append(note);const p=document.createElement('pre');p.textContent=textPayment(bank,st,sc);swap.append(p);if(safePayment(bank,st,sc))addCopy(swap,'Copiar opción intercambiada',textPayment(bank,st,sc)+($('premio').value.trim()?'\nMonto Bs: '+$('premio').value.trim():''));target.append(swap)}
if(r.pago_cedula&&r.cedula&&digits(r.pago_cedula)!==digits(r.cedula)){const alt=document.createElement('details');alt.innerHTML='<summary>Alternativa con cédula de registro</summary>';const p=document.createElement('pre');p.textContent=textPayment(bank,t,r.cedula);alt.append(p);if(safePayment(bank,t,r.cedula))addCopy(alt,'Copiar alternativa',textPayment(bank,t,r.cedula)+($('premio').value.trim()?'\nMonto Bs: '+$('premio').value.trim():''));target.append(alt)}
if(r.pago_telefono&&r.telefono&&digits(r.pago_telefono)!==digits(r.telefono)){const alt=document.createElement('details');alt.innerHTML='<summary>Alternativa con teléfono de registro</summary>';const p=document.createElement('pre');p.textContent=textPayment(bank,r.telefono,c);alt.append(p);if(safePayment(bank,r.telefono,c))addCopy(alt,'Copiar alternativa',textPayment(bank,r.telefono,c)+($('premio').value.trim()?'\nMonto Bs: '+$('premio').value.trim():''));target.append(alt)}
const more=document.createElement('details');more.innerHTML='<summary>Más opciones · comprobante y contacto</summary>';if(r.comprobante&&/^https:\/\//.test(r.comprobante)){const a=document.createElement('a');a.href=r.comprobante;a.target='_blank';a.rel='noopener noreferrer';a.textContent='🧾 Ver comprobante';more.append(a,document.createElement('br'))}
if(validTel(r.telefono)){const w=waPhone(r.telefono);const name=r.nombre||'cliente';[['💬 Contactar cliente','Hola, '+name+'. Te estamos escribiendo de parte de BingoAndino75 para comunicarnos contigo sobre tu premio.'],['🎥 Solicitar video','¡Hola, '+name+'! 🎉 Te escribimos de parte de BingoAndino75. ¡Felicitaciones por tu premio! Nos gustaría que nos compartieras un video corto contando tu experiencia como ganador. Como agradecimiento te obsequiaremos 4 cartones gratis para el próximo sorteo.']].forEach(([label,msg])=>{const a=document.createElement('a');a.href='https://wa.me/'+w+'?text='+encodeURIComponent(msg);a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;more.append(a,document.createElement('br'))})}else{const p=document.createElement('p');p.textContent='Teléfono de registro ausente o inválido; no se genera WhatsApp.';more.append(p)}target.append(more)}
async function sessionUI(){const {data:{session}}=await db.auth.getSession();$('panel').classList.toggle('hide',!session);$('auth').classList.toggle('hide',!!session)}
$('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return;const {error}=await db.auth.signInWithOtp({email});$('authStatus').textContent=error?error.message:'Revisa tu correo. Si recibes un código, escríbelo aquí.'};
$('verify').onclick=async()=>{const {error}=await db.auth.verifyOtp({email:$('email').value.trim(),token:$('otp').value.trim(),type:'email'});$('authStatus').textContent=error?error.message:'Sesión verificada';await sessionUI()};
$('logout').onclick=async()=>{await db.auth.signOut();registros=[];$('result').replaceChildren();await sessionUI()};
async function load(){const {data:{session}}=await db.auth.getSession();if(!session){$('status').textContent='Acceso requerido';return}$('status').textContent='Consultando aprobados...';let all=[];for(let from=0;from<20000;from+=500){const {data,error}=await db.from('inscripciones').select('id,nombre,telefono,cedula,cartones,pago_banco,pago_telefono,pago_cedula,comprobante,estado').eq('estado','aprobado').range(from,from+499);if(error){$('status').textContent='Acceso denegado o error de consulta: '+error.message+' · Requiere permisos RLS autorizados.';return}all.push(...data);if(data.length<500)break}registros=all;const issues=all.map(r=>{let x=[];if(!r.pago_banco)x.push('banco ausente');if(!r.pago_telefono&&r.telefono)x.push('teléfono tomado del registro');if(!r.pago_cedula&&r.cedula)x.push('cédula tomada del registro');const t=r.pago_telefono||r.telefono;const ced=r.pago_cedula||r.cedula;if(swapped(t,ced))x.push('posible teléfono y cédula intercambiados');if(!t||!validTel(t))x.push('teléfono por revisar');const c=digits(r.pago_cedula||r.cedula);if(c.length<6||c.length>9)x.push('cédula por revisar');return {r,x}}).filter(z=>z.x.length);const review=$('review');review.replaceChildren();const details=document.createElement('details');const sum=document.createElement('summary');sum.textContent='⚠ Revisión preventiva: '+issues.length+' compras con datos para revisar';details.append(sum);const note=document.createElement('p');note.className='muted';note.textContent='Las diferencias entre datos de registro y Pago Móvil son normales y NO se marcan como errores. Esta lista solo muestra ausencias y formatos inusuales.';details.append(note);issues.forEach(({r,x})=>{const p=document.createElement('p');p.className='muted';p.textContent=(r.nombre||'Sin nombre')+' · Cartones '+(r.cartones||[]).join(', ')+': '+x.join('; ');details.append(p)});review.append(details);const count=all.reduce((n,r)=>n+(Array.isArray(r.cartones)?r.cartones.length:0),0);$('status').textContent=all.length+' compras aprobadas · '+count+' cartones cargados. Si aparecen cero inesperadamente, revisar permisos RLS.'}
$('load').onclick=load;$('reload').onclick=load;$('find').onclick=()=>{const n=digits($('carton').value);if(!n)return;const matches=registros.filter(r=>Array.isArray(r.cartones)&&r.cartones.some(c=>String(Number(c))===String(Number(n))));if(matches.length>1){$('result').textContent='⚠ Cartón duplicado en '+matches.length+' compras aprobadas. Verificar manualmente.';return}show(matches[0],n)};
db.auth.onAuthStateChange(()=>sessionUI());sessionUI();
</script></body></html>
